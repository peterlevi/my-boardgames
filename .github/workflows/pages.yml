name: Build report and deploy to Pages

# The build reads only the cached data in this repo — no BGG calls, no
# credentials — so it is safe to run on every push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to commit the refreshed README screenshot
  pages: write
  id-token: write

# Let a run finish rather than cancelling a half-finished deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install a browser and fonts for the screenshot
        # The report's font stack leads with Avenir Next, which is a macOS
        # system font. Ubuntu has neither it nor a close match, so without a
        # font here the README screenshot renders in DejaVu and looks nothing
        # like the real page. Inter is the next entry in the stack. Cosmetic
        # only, so a failure here must not fail the build.
        run: |
          pip install playwright
          playwright install --with-deps chromium
          sudo apt-get install -y fonts-inter ||             echo "fonts-inter unavailable; screenshot will use a fallback face"

      - name: Normalise the cached XML
        run: python3 scripts/build.py

      - name: Render the report
        run: python3 scripts/report.py -o site/index.html

      - name: Refresh the README screenshots
        run: |
          python3 scripts/screenshot.py --html site/index.html -o docs/screenshot.png
          python3 scripts/screenshot.py --html site/index.html \
            --expand "Yellow & Yangtze" -o docs/screenshot-expanded.png

      - name: Commit the screenshots if they changed
        # Pushes made with GITHUB_TOKEN do not trigger further workflow runs,
        # so this cannot loop.
        run: |
          if git diff --quiet -- docs/; then
            echo "screenshots unchanged"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/
            git commit -m "Refresh README screenshots [skip ci]"
            # Any commit landing on main between this job's checkout and this
            # push makes a bare push fail on a race that has nothing to do
            # with the screenshots — two pushes in quick succession are
            # enough, and it has already turned a good build red. This commit
            # only ever touches docs/*.png, so rebasing onto whatever arrived
            # cannot conflict with a source change.
            #
            # The checkout is shallow, and rebasing across that boundary is
            # what fails; deepening fixes it but costs a full history, so it
            # happens only on the retry, never on the common first-try path.
            pushed=""
            for attempt in 1 2 3; do
              if git push; then pushed=yes; break; fi
              echo "push rejected (attempt $attempt) - rebasing onto origin/main"
              git fetch --unshallow origin main 2>/dev/null || git fetch origin main
              git rebase origin/main || { git rebase --abort || true; break; }
            done
            if [ -z "$pushed" ]; then
              echo "could not push the refreshed screenshots" >&2
              exit 1
            fi
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
