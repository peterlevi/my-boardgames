</linearGradient>
<radialGradient id="glow" cx="300" cy="380" r="340" gradientUnits="userSpaceOnUse">
<stop offset=".3" stop-color="#f2b764" stop-opacity=".85"/><stop offset=".6" stop-color="#d27a36" stop-opacity=".35"/><stop offset="1" stop-color="#8a3a22" stop-opacity="0"/>
</radialGradient>
<radialGradient id="lamp" r=".5">
<stop offset="0" stop-color="#ffd890" stop-opacity=".9"/><stop offset=".25" stop-color="#f2a64e" stop-opacity=".45"/><stop offset="1" stop-color="#f2a64e" stop-opacity="0"/>
